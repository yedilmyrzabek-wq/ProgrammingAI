[theme]
base = "dark"
primaryColor = "#ffcc00"
backgroundColor = "#222222"
secondaryBackgroundColor = "#2d2d2d"
textColor = "#e6e6e6"
font = "Roboto:https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
codeFont = "Roboto Mono:https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500&display=swap"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
